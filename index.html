<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base target="_top">
  <style>
    * { margin: 0; padding: 0; overflow: hidden; height: 100vh; }
    iframe { border: none; width: 100%; height: 100%; }
  </style>
</head>
<script>
  window.onload = (e) => {
    // ※ ここに「ウェブアプリとしてデプロイ」した際のURLを設定してください
    const gasappurl = 'https://script.google.com/macros/s/AKfycbwbNHK7xYYor-bvmxd8cTo3VqOMNA5C3eoBdqHWQcVLPqFEC39nkA9sc-1A4g7mbjxtAg/exec';
    let ifm = document.getElementById('gasiframe');
    ifm.src = gasappurl + window.location.search;
  }
</script>
<body>
  <div class="container">
    <iframe id="gasiframe" src="about:blank"></iframe>
  </div>
</body>
</html>
