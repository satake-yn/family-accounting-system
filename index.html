<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <link rel="apple-touch-icon" href="IMG_2797.png">
  <link rel="icon" href="IMG_2797.png">
  <base target="_top">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; }
    iframe { border: none; width: 100%; height: 100%; display: none; }
    
    /* ログイン画面スタイル */
    #login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 16px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h2 { font-size: 1.1rem; margin-bottom: 16px; text-align: center; color: #1e293b; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: #64748b; margin-bottom: 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #1e293b; }
    .btn {
      width: 100%;
      padding: 10px;
      background-color: #1e293b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:active { background-color: #334155; }
    .error-msg { color: #dc2626; font-size: 0.75rem; text-align: center; margin-top: 10px; min-height: 1rem; }
  </style>
</head>
<body>
  <!-- ログイン画面 -->
  <div id="login-container">
    <div class="login-card">
      <h2>家計簿アプリ ログイン</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email-input">メールアドレス</label>
          <input type="email" id="email-input" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="passcode-input">パスコード</label>
          <input type="password" id="passcode-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="login-btn">ログイン</button>
        <div id="error-message" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- GAS表示用iframe（URLパラメータは一切付与しない） -->
  <iframe id="gasiframe" src="about:blank"></iframe>

  <script src="auth.js"></script>
</body>
</html>
